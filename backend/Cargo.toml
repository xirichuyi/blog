[package]
name = "chuyi-uk-back"
version = "0.1.0"
edition = "2021"
authors = ["Chuyi <chuyi@chuyi.uk>"]
description = "Rust API for Chuyi Blog"
license = "MIT"
repository = "https://github.com/chuyi/blog"
keywords = ["blog", "api", "rust", "axum", "sqlite"]
categories = ["web-programming"]
build = "build.rs"

[profile.release]
# Optimize for performance and size
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Faster compilation in development
opt-level = 0
debug = true
incremental = true

[dependencies]
# Web framework
axum = { version = "0.7", features = ["http2"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "compression-br"] }
tokio = { version = "1.0", features = ["full"] }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "uuid",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }

# R2 request signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"

# Authentication & Security
jsonwebtoken = "9.2"
bcrypt = "0.15"

# Configuration
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Markdown processing
pulldown-cmark = "0.10"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }
url = "2.5"

# IMAP 邮箱读取（在线工具：邮箱阅读）。native-tls 已在依赖树中（reqwest 默认 TLS）。
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"

thiserror = "1.0"

# Utilities
regex = "1.10"
sysinfo = "0.30"

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }
