name: Build & Deploy to Sigma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------- Frontend (Vite/React) ----------
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Check Markdown editor in Chromium
        working-directory: front
        run: |
          npx playwright install --with-deps chromium
          npm run test:editor

      - name: Build (production)
        working-directory: front
        # VITE_API_URL is intentionally unset → production build uses same-origin
        # ('' + /api), which nginx reverse-proxies to the backend.
        run: |
          npm run typecheck
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: front/dist/
          retention-days: 3
          if-no-files-found: error

  # ---------- Backend (Rust/Axum) ----------
  build-backend:
    # ubuntu-22.04 (glibc 2.35) so the binary runs on the server's Ubuntu 24.04
    # (glibc 2.39). openssl 3.x is ABI-compatible across both.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # sqlx::query! macros are compile-time checked against this DB's schema.
      DATABASE_URL: sqlite:/tmp/blog-build.db
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Prepare schema DB for sqlx compile-time checks
        working-directory: backend
        # Apply migrations to a throwaway SQLite DB so sqlx::query!/query_as!
        # can verify queries at build time (no live DB, no committed .sqlx cache).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3
          rm -f /tmp/blog-build.db
          for f in $(ls migrations/*.sql | sort); do
            echo "applying $f"
            sqlite3 /tmp/blog-build.db < "$f"
          done

      - name: Check Rust formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run backend tests
        working-directory: backend
        run: cargo test --locked

      - name: Verify SQLite backup procedure
        working-directory: backend
        run: |
          rm -rf /tmp/blog-build-backups
          python3 scripts/backup_database.py /tmp/blog-build.db /tmp/blog-build-backups 2
          test "$(sqlite3 /tmp/blog-build-backups/blog-*.db 'PRAGMA quick_check')" = "ok"

      - name: Build release binary
        working-directory: backend
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: backend-binary
          path: backend/target/release/chuyi-uk-back
          retention-days: 3
          if-no-files-found: error

  # ---------- Deploy (rsync artifacts → restart service) ----------
  deploy:
    needs: [build-frontend, build-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: backend-binary
          path: bin

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend assets
        run: |
          chmod -R a+rX dist
          # Keep old hashed assets so browsers with a cached HTML document can
          # still finish loading during a deploy. The entrypoint is activated
          # only after the new backend passes all deployment checks.
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/assets/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/frontend/dist/assets/"

      - name: Deploy tools (gitbook2epub python scripts)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            backend/tools/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/backend/tools/"

      - name: Deploy operational scripts
        run: |
          chmod -R a+rX backend/scripts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            backend/scripts/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/backend/scripts/"

      - name: Prepare analytics environment variables
        env:
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
        run: |
          test -n "$CF_ANALYTICS_API_TOKEN" || {
            echo "CF_ANALYTICS_API_TOKEN secret is missing"
            exit 1
          }
          umask 077
          {
            printf 'CF_ANALYTICS_API_TOKEN=%s\n' "$CF_ANALYTICS_API_TOKEN"
            printf 'CF_ANALYTICS_ACCOUNT_ID=%s\n' 'da0f988dc268fbcea0f67f78601419d6'
            printf 'CF_ANALYTICS_SITE_TAG=%s\n' '16cb4fba33b7403fad2ab9a0dcee6e08'
            printf 'CF_ANALYTICS_SITE_HOST=%s\n' 'blog.chuyi.uk'
          } > analytics-vars

      - name: Verify browser-to-R2 upload path
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              admin_token=$(sudo sed -n "s/^BLOG_ADMIN_TOKEN=//p" \
                /var/www/blog/backend/.env | tail -n 1 | tr -d "\r")
              test -n "$admin_token" || { echo "❌ BLOG_ADMIN_TOKEN is unavailable"; exit 1; }
              printf "%s" "$admin_token" | \
                python3 /var/www/blog/backend/scripts/check_upload_path.py cors
            '

      - name: Deploy backend (upload binary, atomic swap, restart)
        run: |
          chmod +x bin/chuyi-uk-back
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            backend/blog-backend.service \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/blog-backend.service.new"
          rsync -az --chmod=F600 \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            analytics-vars \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/blog-analytics-vars"
          # Upload to a temp name to avoid ETXTBSY on the running binary.
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            bin/chuyi-uk-back \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/backend/target/release/chuyi-uk-back.new"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              cd /var/www/blog/backend
              test -f .env || { echo "production .env is missing"; exit 1; }
              sudo install -d -o www-data -g www-data -m 775 \
                /var/www/blog/backend/data
              sudo chown -R --no-dereference www-data:www-data \
                /var/www/blog/backend/data
              sudo install -d -o www-data -g www-data -m 750 \
                /var/backups/chuyi-blog
              if [ -f data/blog.db ]; then
                sudo -u www-data python3 scripts/backup_database.py \
                  data/blog.db /var/backups/chuyi-blog 7
              fi

              if [ -f target/release/chuyi-uk-back ]; then
                cp -pf target/release/chuyi-uk-back \
                  target/release/chuyi-uk-back.previous
              fi
              if [ -f /etc/systemd/system/blog-backend.service ]; then
                sudo cp -pf /etc/systemd/system/blog-backend.service \
                  /etc/systemd/system/blog-backend.service.previous
              fi
              touch /tmp/blog-backend-deploy-${{ github.run_id }}.swapped

              sudo awk '\''!/^CF_ANALYTICS_(API_TOKEN|ACCOUNT_ID|SITE_TAG|SITE_HOST)=/'\'' \
                .env | sudo tee /tmp/blog.env.merged >/dev/null
              sudo sh -c '\''cat /tmp/blog-analytics-vars >> /tmp/blog.env.merged'\''
              sudo install -o root -g www-data -m 640 \
                /tmp/blog.env.merged \
                /var/www/blog/backend/.env
              sudo rm -f \
                /tmp/blog.env.merged \
                /tmp/blog-analytics-vars \
                /var/www/blog/backend/.analytics.env
              sudo install -o root -g root -m 644 \
                /tmp/blog-backend.service.new \
                /etc/systemd/system/blog-backend.service
              sudo systemctl daemon-reload
              cd /var/www/blog/backend/target/release
              mv -f chuyi-uk-back.new chuyi-uk-back   # atomic on same fs
              chmod +x chuyi-uk-back
              sudo systemctl restart blog-backend
            '

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              healthy=false
              for i in $(seq 1 20); do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3006/api/health/ready || true)
                echo "attempt $i: /api/health/ready -> $code"
                [ "$code" = "200" ] && { healthy=true; break; }
                sleep 2
              done
              if [ "$healthy" != "true" ]; then
                echo "❌ backend did not become healthy"
                sudo systemctl status blog-backend --no-pager | tail -30
                journalctl -u blog-backend --no-pager -n 40
                exit 1
              fi
              echo "backend healthy ✅"

              sudo -u www-data test -w /var/www/blog/backend/data
              sudo -u www-data test -w /var/www/blog/backend/data/blog.db
              echo "SQLite paths writable ✅"

              admin_token=$(sudo sed -n "s/^BLOG_ADMIN_TOKEN=//p" /var/www/blog/backend/.env | tail -n 1 | tr -d "\r")
              test -n "$admin_token" || { echo "❌ BLOG_ADMIN_TOKEN is unavailable"; exit 1; }
              analytics=$(curl -sS \
                -H "Authorization: Bearer $admin_token" \
                "http://127.0.0.1:3006/api/admin/analytics?days=7")
              if printf "%s" "$analytics" | grep -q "\"available\":true"; then
                echo "Cloudflare analytics connected ✅"
              else
                echo "⚠️ Cloudflare analytics check unavailable; deployment will continue: $analytics"
              fi

              printf "%s" "$admin_token" | \
                python3 /var/www/blog/backend/scripts/check_upload_path.py multipart
              echo "R2 multipart resume connected ✅"
            '

      - name: Activate frontend entrypoint
        run: |
          rsync -az --exclude 'assets/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/frontend/dist/"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'rm -f /tmp/blog-backend-deploy-${{ github.run_id }}.swapped' || true

      - name: Roll back backend after a failed deployment check
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              marker=/tmp/blog-backend-deploy-${{ github.run_id }}.swapped
              if [ ! -f "$marker" ]; then
                echo "Backend was not swapped; rollback is unnecessary"
                exit 0
              fi
              cd /var/www/blog/backend
              test -f target/release/chuyi-uk-back.previous || {
                echo "❌ previous backend binary is unavailable"
                exit 1
              }
              cp -pf target/release/chuyi-uk-back.previous \
                target/release/chuyi-uk-back
              if [ -f /etc/systemd/system/blog-backend.service.previous ]; then
                sudo cp -pf /etc/systemd/system/blog-backend.service.previous \
                  /etc/systemd/system/blog-backend.service
              fi
              sudo systemctl daemon-reload
              sudo systemctl restart blog-backend
              for i in $(seq 1 20); do
                code=$(curl -s -o /dev/null -w "%{http_code}" \
                  http://127.0.0.1:3006/api/health/ready || true)
                echo "rollback attempt $i: /api/health/ready -> $code"
                if [ "$code" = "200" ]; then
                  rm -f "$marker"
                  echo "Previous backend restored ✅"
                  exit 0
                fi
                sleep 2
              done
              sudo systemctl status blog-backend --no-pager | tail -30
              journalctl -u blog-backend --no-pager -n 40
              exit 1
            '
